name: Bons desktop (Windows .exe)

on:
  push:
    branches: ['**']
    # A tag like bons-v1.0.0 builds the .exe and publishes it as a GitHub Release
    tags: ['bons-v*']
    paths:
      - 'bons-desktop/**'
      - '.github/workflows/bons-desktop.yml'
  pull_request:
    paths:
      - 'bons-desktop/**'
      - '.github/workflows/bons-desktop.yml'
  workflow_dispatch:

concurrency:
  group: bons-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    # Same tests plus real Tesseract OCR (eng + ara)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bons-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bons-desktop/requirements-dev.txt
      - name: System packages (Qt runtime libs, Tesseract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core \
            tesseract-ocr tesseract-ocr-ara
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bons-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bons-desktop/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
      - name: Build ARACO_Bons.exe
        run: pyinstaller --noconfirm --clean araco_bons.spec
      - name: Self-test the packaged .exe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'selftest'
          $p = Start-Process -FilePath 'dist\ARACO_Bons.exe' -ArgumentList '--selftest', "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out 'selftest.txt')
          if ($p.ExitCode -ne 0) { exit 1 }
          Copy-Item (Join-Path $out 'selftest_*.png') dist\
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\ARACO_Bons.exe, README.md release\
          Copy-Item dist\selftest_*.png release\
      - uses: actions/upload-artifact@v4
        with:
          name: ARACO_Bons-windows
          path: bons-desktop/release
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/bons-v')
    needs: [test-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ARACO_Bons-windows
          path: release
      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## ARACO Bons — برنامج الزبائن والبونات (Windows)

          **التنزيل:** اضغط على `ARACO_Bons.exe` أدناه، ثم شغّله بالضغط المزدوج.
          إذا ظهرت رسالة «Windows protected your PC» اضغط **More info ← Run anyway**.

          - الدخول الأول: `admin` / `admin123`، وغيّر كلمة المرور فوراً.
          - البيانات محفوظة في `C:\ARACO_Data`، والنسخة الجديدة من البرنامج لا تمسحها.
          - للقراءة التلقائية للبونات (OCR) ثبّت Tesseract، كما في القسم 2 من `README.md`.

          **Download:** click `ARACO_Bons.exe` below and double-click it. On the SmartScreen warning choose
          *More info → Run anyway*. First login `admin` / `admin123`. Data lives in `C:\ARACO_Data`
          and is kept when you replace the .exe with a newer version.
          NOTES
      - uses: softprops/action-gh-release@v2
        with:
          name: ARACO Bons ${{ github.ref_name }}
          body_path: notes.md
          files: |
            release/ARACO_Bons.exe
            release/README.md
          make_latest: true
