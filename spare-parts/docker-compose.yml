# Usage: cp .env.example .env  (set passwords/secret)  →  docker compose up -d --build
#        docker compose exec app node dist/src/import/cli.js   (one-time import of the original workbook)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: araco
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: araco_spares
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U araco -d araco_spares"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://araco:${DB_PASSWORD}@db:5432/araco_spares
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      SESSION_HOURS: ${SESSION_HOURS:-12}
    ports:
      - "${APP_PORT:-4100}:4100"
    volumes:
      - app_storage:/app/storage   # pictures, imports, exports, backups

volumes:
  db_data:
  app_storage:
